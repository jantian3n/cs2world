[package]
name = "cs2world-xp"
version = "0.1.0"
edition = "2021"
description = "CS2World Native Win32 Windows XP-Style Client"

[build-dependencies]
embed-resource = "3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cs2world-proto = { path = "../crates/cs2world-proto" }
cs2world-core = { path = "../crates/cs2world-core", features = ["tun"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync", "macros"] }
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinInet",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
