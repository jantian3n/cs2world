name: Release sing-box-cs2world

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Determine Version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=0.0.1" >> $GITHUB_OUTPUT
          fi

      - name: Build Multi-Platform Binaries
        env:
          TAGS: with_gvisor,with_quic,with_utls,with_clash_api
          VER: ${{ steps.ver.outputs.VERSION }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X 'github.com/sagernet/sing-box/constant.Version=1.14.4-cs2world-${VER}'"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags "${TAGS}" -trimpath -ldflags="${LDFLAGS}" -o dist/sing-box-cs2world-linux-amd64 ./cmd/sing-box-cs2world
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags "${TAGS}" -trimpath -ldflags="${LDFLAGS}" -o dist/sing-box-cs2world-linux-arm64 ./cmd/sing-box-cs2world
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -tags "${TAGS}" -trimpath -ldflags="${LDFLAGS}" -o dist/sing-box-cs2world-darwin-arm64 ./cmd/sing-box-cs2world
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -tags "${TAGS}" -trimpath -ldflags="${LDFLAGS}" -o dist/sing-box-cs2world-darwin-amd64 ./cmd/sing-box-cs2world
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags "${TAGS}" -trimpath -ldflags="${LDFLAGS}" -o dist/sing-box-cs2world-windows-amd64.exe ./cmd/sing-box-cs2world

          cd dist && sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
