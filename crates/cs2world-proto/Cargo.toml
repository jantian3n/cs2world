[package]
name = "cs2world-proto"
version = "0.1.0"
edition = "2021"


[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
hmac = { version = "0.12.1", default-features = false }
libm = "0.2"
percent-encoding = { version = "2.3", default-features = false, features = ["alloc"] }
rand_core = { version = "0.6.4", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
sha2 = { version = "0.10.9", default-features = false }
subtle = { version = "2.6", default-features = false }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["zeroize", "static_secrets"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
reed-solomon-erasure = { version = "=6.0.0", default-features = false }
url = { version = "2.5.8", default-features = false }
